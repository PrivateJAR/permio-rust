[package]
name = "permio-rust"
version = "0.0.18"
edition = "2021"
rust-version = "1.75"
description = "Generated Protocol Buffer and gRPC client code for the perms.io API"
license = "Apache-2.0"
repository = "https://github.com/PrivateJAR/permio-rust"
homepage = "https://perms.io"

# Generated with buf.build/community/neoeinstein-prost v0.5.0 and
# neoeinstein-tonic v0.5.0, which target prost 0.14 and tonic 0.14 (tonic-prost codec).
[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

[features]
default = []
# TLS for connecting to https://api.perms.io (rustls with native roots).
tls = ["tonic/tls-ring", "tonic/tls-native-roots"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
path = "src/lib.rs"
