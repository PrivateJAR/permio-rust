[package]
name = "permio"
version = "0.1.0"
edition = "2021"
# tonic 0.14 needs Rust 1.88.
rust-version = "1.88"
resolver = "3"
description = "Rust SDK for perms.io: permission checks, grants, groups and the raw gRPC API"
license = "Apache-2.0"
repository = "https://github.com/PrivateJAR/permio-rust"
homepage = "https://perms.io"
documentation = "https://docs.rs/permio"
readme = "README.md"
keywords = ["permissions", "rbac", "authorization", "grpc", "perms"]
categories = ["authentication", "api-bindings", "web-programming"]
include = ["src/**/*.rs", "examples/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

# The generated code in src/permio and src/pagination comes from
# buf.build/community/neoeinstein-prost v0.5.0 and neoeinstein-tonic v0.5.0,
# which target prost 0.14 and tonic 0.14 (tonic-prost codec).
[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[features]
default = ["tls"]
# TLS (rustls with ring) for https endpoints such as https://api.perms.io,
# trusting the platform's certificates and the bundled webpki roots.
tls = ["tonic/tls-ring", "tonic/tls-native-roots", "tonic/tls-webpki-roots"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"
